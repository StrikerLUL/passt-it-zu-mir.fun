# /etc/nginx/sites-available/passt-it-zu-mir.fun.conf
# HTTPS wird danach von certbot ergänzt:
#   certbot --nginx -d passt-it-zu-mir.fun -d www.passt-it-zu-mir.fun --redirect
server {
    listen 80;
    listen [::]:80;
    server_name passt-it-zu-mir.fun www.passt-it-zu-mir.fun;

    location / {
        proxy_pass http://127.0.0.1:3847;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
